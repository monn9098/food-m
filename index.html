<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสั่งอาหารและติดตามสถานะคิว</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h2, h3 { margin-top: 0; color: #2c3e50; }
        
        /* ฟอร์มสั่งอาหาร */
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        select, input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .btn-order { background-color: #e74c3c; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
        .btn-order:hover { background-color: #c0392b; }

        /* ตารางติดตามสถานะ */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: #f8f9fa; }

        /* Badge สถานะ */
        .status-badge { padding: 6px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; display: inline-block; }
        .status-queue { background-color: #f1c40f; color: #7f8c8d; } /* รอคิว */
        .status-cooking { background-color: #3498db; color: white; } /* กำลังทำ */
        .status-done { background-color: #2ecc71; color: white; } /* อาหารเสร็จแล้ว */

        /* ปุ่มจัดการสถานะฝั่งร้านค้า */
        .btn-status { padding: 5px 10px; margin-right: 2px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .btn-wait { background-color: #f1c40f; color: #333; }
        .btn-cook { background-color: #3498db; color: white; }
        .btn-ready { background-color: #2ecc71; color: white; }
    </style>
</head>
<body>

<div class="container">
    
    <!-- 1. ส่วนลูกค้าระบุตัวเลือกและสั่งอาหาร -->
    <div class="card">
        <h2>🍔 สั่งอาหารออนไลน์</h2>
        
        <div class="form-group">
            <label for="menu">เลือกเมนูอาหาร:</label>
            <select id="menu">
                <option value="ข้าวผัดกะเพราหมูสับ">ข้าวผัดกะเพราหมูสับ (50 บาท)</option>
                <option value="ข้าวผัดคะน้าหมูกรอบ">ข้าวผัดคะน้าหมูกรอบ (60 บาท)</option>
                <option value="ข้าวไข่เจียวหมูสับ">ข้าวไข่เจียวหมูสับ (40 บาท)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="spicy">ระดับความเผ็ด:</label>
            <select id="spicy">
                <option value="เผ็ดน้อย">เผ็ดน้อย</option>
                <option value="เผ็ดกลาง" selected>เผ็ดกลาง</option>
                <option value="เผ็ดมาก">เผ็ดมาก</option>
                <option value="ไม่เผ็ด">ไม่เผ็ด</option>
            </select>
        </div>

        <div class="form-group">
            <label for="note">เพิ่มเติม / รสชาติพิเศษ:</label>
            <input type="text" id="note" placeholder="เช่น เพิ่มไข่ดาว, เค็มน้อย, ไม่ใส่ผัก">
        </div>

        <button class="btn-order" onclick="createOrder()">กดสั่งอาหาร</button>
    </div>

    <!-- 2. ตารางแสดงออเดอร์และสถานะคิว -->
    <div class="card">
        <h3>📋 สถานะคิวอาหาร</h3>
        <table>
            <thead>
                <tr>
                    <th>เลขออเดอร์</th>
                    <th>รายการอาหาร</th>
                    <th>รายละเอียด / รสชาติ</th>
                    <th>สถานะ</th>
                    <th>ปรับสถานะ (สำหรับร้าน)</th>
                </tr>
            </thead>
            <tbody id="orderList">
                <!-- รายการออเดอร์จะมาขึ้นตรงนี้ -->
            </tbody>
        </table>
    </div>

</div>

<script>
    let orderCounter = 1;
    let orders = [];

    // ฟังก์ชันสร้างออเดอร์ใหม่
    function createOrder() {
        const menu = document.getElementById('menu').value;
        const spicy = document.getElementById('spicy').value;
        const note = document.getElementById('note').value || 'ปกติ';
        
        // รันเลขออเดอร์ เช่น O-001, O-002
        const orderId = 'O-' + String(orderCounter).padStart(3, '0');
        
        // เมื่อสั่งใหม่ ให้สถานะเริ่มต้นเป็น "รอคิว"
        const newOrder = {
            id: orderId,
            menu: menu,
            detail: `เผ็ด: ${spicy} | หมายเหตุ: ${note}`,
            status: 'รอคิว'
        };

        orders.push(newOrder);
        orderCounter++;
        
        // ล้างช่องกรอกเพิ่มเติม
        document.getElementById('note').value = '';

        // อัปเดตตารางแสดงผล
        renderOrders();
    }

    // ฟังก์ชันเปลี่ยนสถานะออเดอร์
    function updateStatus(index, newStatus) {
        orders[index].status = newStatus;
        renderOrders();
    }

    // ฟังก์ชันวาดตารางออเดอร์ใหม่
    function renderOrders() {
        const tbody = document.getElementById('orderList');
        tbody.innerHTML = '';

        orders.forEach((order, index) => {
            let badgeClass = '';
            if (order.status === 'รอคิว') badgeClass = 'status-queue';
            else if (order.status === 'กำลังทำ') badgeClass = 'status-cooking';
            else if (order.status === 'อาหารเสร็จแล้ว') badgeClass = 'status-done';

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${order.id}</strong></td>
                <td>${order.menu}</td>
                <td><small>${order.detail}</small></td>
                <td><span class="status-badge ${badgeClass}">${order.status}</span></td>
                <td>
                    <button class="btn-status btn-wait" onclick="updateStatus(${index}, 'รอคิว')">รอคิว</button>
                    <button class="btn-status btn-cook" onclick="updateStatus(${index}, 'กำลังทำ')">กำลังทำ</button>
                    <button class="btn-status btn-ready" onclick="updateStatus(${index}, 'อาหารเสร็จแล้ว')">เสร็จแล้ว</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }
</script>

</body>
</html>
